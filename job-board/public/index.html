<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RY7W3N56RE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      // send_page_view is off because this is a single-page app: gtag would
      // count one view at load and nothing after it, so every page but the
      // landing one would be invisible. src/analytics.ts sends them instead,
      // on the same navigation the title and canonical are set on.
      gtag('config', 'G-RY7W3N56RE', { send_page_view: false });
    </script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000103" />
    <link rel="icon" href="%PUBLIC_URL%/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="Curated startup and scaleup jobs in Australia for international students and graduates, with migration pathways and visa info!"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Defaults for a crawler or preview bot that reads the HTML without
         running the app. src/seo.ts overwrites them per address once it does. -->
    <link rel="canonical" href="https://international-student-job-board.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="International Student Job Board" />
    <meta
      property="og:title"
      content="International Student Job Board"
    />
    <meta
      property="og:description"
      content="Curated startup and scaleup jobs in Australia for international students and graduates, with migration pathways and visa info!"
    />
    <meta property="og:url" content="https://international-student-job-board.github.io/" />
    <meta
      property="og:image"
      content="https://international-student-job-board.github.io/icons/android-chrome-512x512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="https://international-student-job-board.github.io/icons/android-chrome-512x512.png"
    />
    <title>International Student Job Board | Australian Startup Jobs</title>
    <!-- Styles the crawler-facing snapshot seo-assets.js writes into #root (see
         scripts/seo-assets.js), which is what a real browser also paints for the
         moment before React mounts and replaces it. Reads the app's own palette
         and font from main.css's :root, so it can't drift out of sync with it;
         a no-op once React has taken over, since .preboot never appears in the
         app's own markup. -->
    <style>
      .preboot {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px;
        font-family: var(--font, sans-serif);
        color: var(--ink, #111);
        line-height: 1.5;
      }
      .preboot h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }
      .preboot h2 {
        font-size: 1.125rem;
        margin: 28px 0 10px;
      }
      .preboot p {
        margin: 0 0 12px;
      }
      .preboot dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        margin: 0 0 16px;
      }
      .preboot dt {
        font-weight: 600;
      }
      .preboot dd {
        margin: 0;
      }
      .preboot ul {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
      }
      .preboot li {
        padding: 10px 0;
        border-bottom: 1px solid var(--line, #ddd);
      }
      .preboot a {
        color: inherit;
      }
      .preboot nav {
        margin-top: 24px;
        font-size: 0.875rem;
        color: var(--muted, #666);
      }
    </style>
  </head>
  <body>
    <noscript
      >Search, filters and the map need JavaScript. The roles and companies
      below are still browsable without it.</noscript
    >
    <div id="root"></div>
  </body>
</html>
